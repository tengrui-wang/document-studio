[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "document-studio"
version = "0.2.0b1"
description = "Local Windows Word/PDF utilities with cloud translation"
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-or-later"
dependencies = [
  "PySide6==6.8.3", "PyMuPDF>=1.25,<2", "python-docx>=1.1,<2",
  "pdf2docx>=0.5.8,<0.6", "httpx>=0.28,<1", "keyring>=25,<26",
  "pywin32>=308; sys_platform == 'win32'", "packaging>=24,<27"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
document-studio = "document_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
